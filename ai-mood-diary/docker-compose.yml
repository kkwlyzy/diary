services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mood-diary-backend
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=${DB_HOST:-192.168.100.130}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-bookadmin}
      - DB_PASSWORD=${DB_PASSWORD:-123456}
      - DB_NAME=${DB_NAME:-ai_mood_diary}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-ai-mood-diary-secret-key-2024}
      - ARK_API_KEY=${ARK_API_KEY}
      - ARK_API_BASE=${ARK_API_BASE:-https://ark.cn-beijing.volces.com/api/coding}
      - ARK_MODEL=${ARK_MODEL:-ark-code-latest}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: mood-diary-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
